:root {
  --bg: #F4F1EA; --surface: #FFFFFF; --ink: #17151A; --muted: #6B6672; --line: #E3DED3;
  --accent: #D6336C; --accent-soft: #FBE3EC;
  --book: #1F7A55; --book-soft: #DDF0E6;
  --edu: #B4531B; --edu-soft: #F8E5D6;
  --eng: #2456D6; --eng-soft: #DFE8FB;
  --bad: #B3261E;
  --font: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151318; --surface: #1F1C24; --ink: #F3F0F7; --muted: #A29CAD; --line: #332F3B;
    --accent: #FF6FA0; --accent-soft: #3A1F2D;
    --book: #5FD1A0; --book-soft: #1B3328; --edu: #F3A06A; --edu-soft: #3A2616; --eng: #8DB0FF; --eng-soft: #1D2A4A;
    --bad: #FF8A80; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151318; --surface: #1F1C24; --ink: #F3F0F7; --muted: #A29CAD; --line: #332F3B;
  --accent: #FF6FA0; --accent-soft: #3A1F2D;
  --book: #5FD1A0; --book-soft: #1B3328; --edu: #F3A06A; --edu-soft: #3A2616; --eng: #8DB0FF; --eng-soft: #1D2A4A;
  --bad: #FF8A80; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: max(16px, env(safe-area-inset-top, 0px)); padding-bottom: 110px;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }
.app { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { background: var(--ink); color: var(--bg); font-weight: 800; font-size: 11px; letter-spacing: .14em; padding: 8px 12px; border-radius: 9px; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 11px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.seg.wide { display: flex; }
.seg.wide button { flex: 1; padding: 9px 12px; font-size: 14px; }
.seg.wide button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.seg.scroll { display: flex; overflow-x: auto; scrollbar-width: none; }
.seg.scroll button { flex: none; }

.hero { --c: var(--accent); --cs: var(--accent-soft); position: relative; overflow: hidden; border-radius: 16px; background: var(--cs); min-height: 116px; padding: 12px; }
.hero > svg { position: absolute; inset: 0; width: 100%; height: 100%; color: var(--c); opacity: .5; }
.hero .top { position: relative; }

.who summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.who summary::-webkit-details-marker { display: none; }
h1 { margin: 0; font-size: 26px; line-height: 1.12; font-weight: 800; letter-spacing: -.02em; text-wrap: balance; overflow-wrap: anywhere; }
.caret { color: var(--muted); font-size: 12px; flex: none; }
.who[open] .caret { transform: rotate(180deg); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { font-size: 12px; font-weight: 600; padding: 4px 9px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); }
.chip.eng { background: var(--eng-soft); border-color: transparent; color: var(--eng); }
.chip.book { background: var(--book-soft); border-color: transparent; color: var(--book); }
.chip.edu { background: var(--edu-soft); border-color: transparent; color: var(--edu); }
.chip.warn { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.panel { margin-top: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 10px; }
.kv { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
.kv span:first-child { color: var(--muted); }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.ghost { border: 1px solid var(--line); background: transparent; border-radius: 9px; padding: 8px 12px; font-size: 13px; font-weight: 600; }
.solid { border: 0; background: var(--ink); color: var(--bg); border-radius: 10px; padding: 10px 16px; font-weight: 700; }
.solid.pink { background: var(--accent); color: #fff; }
.danger { border-color: var(--bad); color: var(--bad); }

.ring { display: block; width: 148px; height: 148px; margin: 0 auto; }
.ring circle { fill: none; stroke-width: 12; stroke-linecap: round; }
.ring .trk { stroke: var(--surface); }
.ring .arc { stroke: var(--c); transition: stroke-dashoffset .6s ease; }
.ring text { font-family: var(--font); font-size: 30px; font-weight: 800; fill: var(--ink); font-variant-numeric: tabular-nums; }
.pending.c { text-align: center; font-size: 15px; font-weight: 700; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--surface); }
.stats > div { text-align: center; padding: 10px 4px 2px; min-width: 0; }
.stats > div + div { border-left: 1px solid var(--surface); }
.stats b { display: block; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stats span { font-size: 12px; color: var(--muted); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
.kicker { margin: 0; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.card h2 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -.01em; overflow-wrap: anywhere; }
.stack { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.c-book { --c: var(--book); --cs: var(--book-soft); }
.c-edu { --c: var(--edu); --cs: var(--edu-soft); }
.c-eng { --c: var(--eng); --cs: var(--eng-soft); }
.total { background: var(--cs); border-color: transparent; }
.total .kicker { color: var(--c); }
.sub, .note { font-size: 13px; color: var(--muted); margin: 0; }

.row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(72px, 38%) 40px; align-items: center; gap: 12px; }
.bar { height: 8px; background: var(--cs); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--c); border-radius: 99px; }
.val { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
.val.none { color: var(--muted); font-weight: 500; }
.pmrow { display: flex; gap: 8px; flex-wrap: wrap; }
.pm { min-width: 56px; text-align: center; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-weight: 700; font-size: 14px; }
.pm.plus { background: var(--book-soft); color: var(--book); border-color: transparent; }
.pm.minus { background: var(--accent-soft); color: var(--bad); border-color: transparent; }
.pm small { display: block; font-size: 10px; font-weight: 600; color: var(--muted); }

.day { display: grid; gap: 2px; }
.dayhead { display: flex; align-items: center; gap: 8px; padding: 2px 2px 6px; }
.dayhead h3 { margin: 0; font-size: 14px; font-weight: 700; }
.today { background: var(--accent); color: #fff; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; }
.slot { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.time { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 14px; line-height: 1.25; }
.time small { display: block; color: var(--muted); font-weight: 500; font-size: 13px; }
.slot .t { font-weight: 600; }
.tag { display: inline-block; margin-top: 4px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; }
.tag.eng { background: var(--eng-soft); color: var(--eng); }
.tag.be { background: var(--book-soft); color: var(--book); }
.free { font-size: 13px; color: var(--muted); padding: 8px 0; border-top: 1px solid var(--line); }
.day.is-today { background: var(--accent-soft); border-radius: 12px; padding: 8px 12px 4px; margin: 0 -12px; }
.day.is-today .slot, .day.is-today .free { border-color: transparent; }
.cta { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--ink); color: var(--bg); text-decoration: none; font-weight: 700; padding: 13px 18px; border-radius: 12px; }
.idp-text { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-left, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-right, 0px)); }
.tabs-in { max-width: 760px; margin: 0 auto; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; }
.tabs button { border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 2px; border-radius: 10px; font-size: 11px; font-weight: 600; color: var(--muted); min-width: 0; }
.tabs button span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tabs button[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
.tabs svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); font-size: 13px; font-weight: 600; padding: 9px 14px; border-radius: 10px; max-width: calc(100vw - 32px); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 9; }
.toast.on { opacity: 1; }

/* формы */
label.f { display: grid; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 600; }
input.t, select.t, textarea.t { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 11px 12px; font-size: 16px; color: var(--ink); }
textarea.t { min-height: 120px; resize: vertical; }
.login { margin-top: 8px; }
.err { color: var(--bad); font-size: 13px; font-weight: 600; min-height: 18px; margin: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }

/* таблица оценок */
.gwrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); -webkit-overflow-scrolling: touch; }
table.g { border-collapse: separate; border-spacing: 0; font-size: 13px; min-width: 100%; }
.g th, .g td { padding: 6px 4px; text-align: center; border-bottom: 1px solid var(--line); white-space: nowrap; }
.g th { font-size: 11px; color: var(--muted); font-weight: 700; background: var(--surface); }
.g th:first-child, .g td:first-child { position: sticky; left: 0; z-index: 1; background: var(--surface); text-align: left; padding-left: 10px; min-width: 128px; max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
.g tr:last-child td { border-bottom: 0; }
.g td:first-child button { border: 0; background: transparent; padding: 0; text-align: left; font-weight: 600; font-size: 13px; max-width: 136px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.g td.tot { font-weight: 800; font-variant-numeric: tabular-nums; padding: 6px 10px; }
input.cell { width: 46px; text-align: center; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 7px 2px; font-size: 15px; font-variant-numeric: tabular-nums; }
input.cell:disabled { background: transparent; border-color: transparent; color: var(--ink); opacity: .8; }
.sep { border-left: 2px solid var(--line); }
.dim { opacity: .55; }
.list { display: grid; gap: 8px; }
.li { display: flex; align-items: center; justify-content: space-between; gap: 10px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; width: 100%; text-align: left; }
.li .n { font-weight: 600; overflow-wrap: anywhere; }
.li .m { font-size: 12px; color: var(--muted); }
.mini { display: flex; gap: 6px; flex: none; }
.mini span { font-size: 11px; font-weight: 700; padding: 3px 7px; border-radius: 99px; font-variant-numeric: tabular-nums; }
.mini .b { background: var(--book-soft); color: var(--book); } .mini .e { background: var(--edu-soft); color: var(--edu); } .mini .g { background: var(--eng-soft); color: var(--eng); }
.back { align-self: flex-start; }
@media (prefers-reduced-motion: reduce) { .ring .arc, .toast { transition: none; } }
</style>

async function fetchAll(table, build) {
  var all = [], from = 0, step = 1000;
  for (;;) {
    var q = sb.from(table).select('*');
    if (build) q = build(q);
    q = q.range(from, from + step - 1);
    var r = await q;
    if (r.error) throw r.error;
    all = all.concat(r.data);
    if (r.data.length < step) break;
    from += step;
  }
  return all;
}
async function loadAll() {
  var r = await Promise.all([
    fetchAll('profiles', function (q) { return q.order('id'); }),
    fetchAll('students', function (q) { return q.order('id'); }),
    fetchAll('mentor_groups', function (q) { return q.order('id'); }),
    fetchAll('english_groups', function (q) { return q.order('id'); }),
    fetchAll('periods', function (q) { return q.order('code'); }),
    fetchAll('books', function (q) { return q.order('period_id').order('course'); }),
    fetchAll('schedule_slots', function (q) { return q.order('id'); }),
    fetchAll('idp_notes', function (q) { return q.order('student_id'); })
  ]);
  D.profiles = {}; r[0].forEach(function (p) { D.profiles[p.id] = p; });
  D.students = {}; r[1].forEach(function (s) { D.students[s.id] = s; });
  D.mgroups = r[2]; D.egroups = r[3]; D.periods = r[4]; D.books = r[5]; D.slots = r[6];
  D.idp = {}; r[7].forEach(function (n) { D.idp[n.student_id] = n; });
  D.scores = {};
  var me = D.profiles[S.uid];
  S.admin = !!(me && me.is_admin);
  S.mg = D.mgroups.filter(function (g) { return g.mentor_id === S.uid; });
  S.tg = D.egroups.filter(function (g) { return g.teacher_id === S.uid; });
  var now = new Date(), code = now.getFullYear() + '-' + ('0' + (now.getMonth() + 1)).slice(-2);
  var cur = D.periods.filter(function (p) { return p.code === code; })[0] || D.periods[D.periods.length - 1];
  S.period = cur ? cur.id : null;
  await loadScores(S.period);
}
async function loadScores(pid) {
  if (pid == null || D.scores[pid]) return;
  var rows = await fetchAll('scores', function (q) { return q.eq('period_id', pid).order('student_id').order('subject').order('item'); });
  var m = {};
  rows.forEach(function (r) { m[r.student_id + '|' + r.subject + '|' + r.item] = Number(r.value); });
  D.scores[pid] = m;
}
function curPeriod() { return D.periods.filter(function (p) { return p.id === S.period; })[0]; }
function getScore(sid, subj, item) {
  var m = D.scores[S.period]; if (!m) return null;
  var v = m[sid + '|' + subj + '|' + item]; return v == null ? null : v;
}
function bookFor(course) {
  return D.books.filter(function (b) { return b.period_id === S.period && b.course === course; })[0] || null;
}
/* то же правило, что в базе: итог появляется, когда выставлены все экзамены */
function calc(sid, subj) {
  var P = curPeriod(), wk, ex, need, ww, we;
  if (!P) return { weekly: null, exams: [], examAvg: null, total: null, ww: 0, we: 0, any: false };
  if (subj === 'book') { wk = ITEMS.book.slice(0, 6); ex = ['test', 'exam2']; need = 2; ww = P.w_book_weekly; we = P.w_book_exam; }
  else if (subj === 'edu') { wk = ITEMS.edu.slice(0, 6); ex = ['ent']; need = 1; ww = P.w_edu_weekly; we = P.w_edu_exam; }
  else { wk = ['w1', 'w2', 'w3']; ex = ['exam']; need = 1; ww = P.w_eng_weekly; we = P.w_eng_exam; }
  ww = Number(ww); we = Number(we);
  var weekly = avg(wk.map(function (i) { return getScore(sid, subj, i); }));
  var exams = ex.map(function (i) { return getScore(sid, subj, i); });
  var done = exams.filter(function (v) { return v != null; }).length;
  var examAvg = avg(exams), any = weekly != null || done > 0, total = null;
  if (any && !(we > 0 && done < need)) total = (weekly == null ? 0 : weekly) * ww + (examAvg == null ? 0 : examAvg) * we;
  return { weekly: weekly, exams: exams, examAvg: examAvg, total: total, ww: ww, we: we, any: any };
}
async function saveScore(sid, subj, item, val) {
  var pid = S.period, key = sid + '|' + subj + '|' + item, had = D.scores[pid][key] != null, r;
  if (val == null) {
    r = await sb.from('scores').delete().match({ student_id: sid, period_id: pid, subject: subj, item: item }).select();
    if (!r.error && had && (!r.data || !r.data.length)) r = { error: { message: 'denied' } };
  } else {
    r = await sb.from('scores').upsert({ student_id: sid, period_id: pid, subject: subj, item: item, value: val, entered_by: S.uid, updated_at: new Date().toISOString() }, { onConflict: 'student_id,period_id,subject,item' }).select();
  }
  if (r.error) { toast(t('saveErr')); return false; }
  if (val == null) delete D.scores[pid][key]; else D.scores[pid][key] = val;
  return true;
}

function gridHtml(list, subj, course) {
  var cols = colsFor(subj, course);
  if (!list.length) return '<p class="note">' + t('noStudents') + '</p>';
  var h = '<div class="gwrap"><table class="g"><thead><tr><th></th>' + cols.map(function (c) { return '<th' + (c.sep ? ' class="sep"' : '') + '>' + esc(c.label) + '</th>'; }).join('') + '<th class="sep">' + t('sum') + '</th></tr></thead><tbody>';
  list.forEach(function (stu) {
    var ed = editable(stu, subj), tot = calc(stu.id, subj).total;
    h += '<tr' + (stu.status !== 'active' ? ' class="dim"' : '') + '><td><button type="button" data-a="open" data-sid="' + stu.id + '">' + esc(pname(stu.id)) + '</button></td>';
    cols.forEach(function (c) {
      var v = getScore(stu.id, subj, c.item);
      h += '<td' + (c.sep ? ' class="sep"' : '') + '><input class="cell" inputmode="decimal" autocomplete="off" data-sid="' + stu.id + '" data-subj="' + subj + '" data-item="' + c.item + '" value="' + (v == null ? '' : v) + '"' + (ed ? '' : ' disabled') + '></td>';
    });
    h += '<td class="tot sep" data-tot="' + stu.id + '|' + subj + '">' + fmt(tot) + '</td></tr>';
  });
  return h + '</tbody></table></div>';
}
function groupOptions() {
  var opts = [];
  var mg = S.admin ? D.mgroups : S.mg, eg = S.admin ? D.egroups : S.tg;
  mg.forEach(function (g) { opts.push({ v: 'm:' + g.id, label: g.name + ' · ' + (g.gender === 'M' ? t('boys') : t('girls')) }); });
  eg.forEach(function (g) { opts.push({ v: 'e:' + g.id, label: 'EN · ' + g.name }); });
  return opts;
}
function groupStudents(sel) {
  var id = Number(sel.slice(2));
  return Object.keys(D.students).map(function (k) { return D.students[k]; }).filter(function (s) {
    return sel[0] === 'm' ? s.mentor_group_id === id : s.english_group_id === id;
  }).sort(byName);
}
function specialCards(list) {
  var sp = list.filter(function (s) { return s.kind === 'special'; }), out = '';
  sp.forEach(function (stu) {
    var edM = editable(stu, 'book'), v = getScore(stu.id, 'speech', 'exam'), h = '';
    for (var w = 1; w <= 4; w++) h += pmBtn(stu.id, 'w' + w, getScore(stu.id, 'sport', 'w' + w), edM, t('stepsWeek') + ' ' + w);
    var n = D.idp[stu.id];
    out += '<section class="card"><h2>' + esc(pname(stu.id)) + '</h2>' +
      '<p class="kicker">' + esc(stu.special_subject || t('edu')) + ' · ' + t('monthExam') + '</p>' +
      '<div><input class="cell" inputmode="decimal" data-sid="' + stu.id + '" data-subj="speech" data-item="exam" value="' + (v == null ? '' : v) + '"' + (edM ? '' : ' disabled') + '></div>' +
      '<p class="kicker">' + t('steps') + '</p><div class="pmrow">' + h + '</div>' +
      '<p class="kicker">' + t('idpSite') + '</p><textarea class="t" id="idp-' + stu.id + '"' + (edM ? '' : ' disabled') + '>' + esc(n ? n.content : '') + '</textarea>' +
      (edM ? '<div><button type="button" class="solid pink" data-a="idpsave" data-sid="' + stu.id + '">' + t('save') + '</button></div>' : '') + '</section>';
  });

}
function viewGrades() {
  var opts = groupOptions();
  if (!opts.length) return '<p class="note">' + t('noRights') + '</p>';
  if (!opts.some(function (o) { return o.v === S.gsel; })) S.gsel = opts[0].v;
  var list = groupStudents(S.gsel), isM = S.gsel[0] === 'm', P = curPeriod();
  var out = '<label class="f">' + t('group') + '<select class="t" id="gsel">' + opts.map(function (o) { return '<option value="' + o.v + '"' + (o.v === S.gsel ? ' selected' : '') + '>' + esc(o.label) + '</option>'; }).join('') + '</select></label>';
  if (P && P.locked) out += '<p class="note">🔒 ' + (S.admin ? t('monthLocked') : t('locked')) + '</p>';
  var subs = isM ? ['book', 'edu', 'english'] : ['english'];
  if (isM && list.some(function (s) { return s.kind === 'special'; })) subs.push('special');
  if (subs.indexOf(S.gsub) < 0) S.gsub = subs[0];
  if (subs.length > 1) out += '<div class="seg wide" role="group">' + subs.map(function (k) { return '<button type="button" data-gsub="' + k + '" aria-pressed="' + (S.gsub === k) + '">' + (k === 'special' ? t('specials') : k === 'english' ? t('eng') : t(k)) + '</button>'; }).join('') + '</div>';
  var course = list.length ? list[0].course : null;
  if (S.gsub === 'special') out += specialCards(list);
  else {
    var shown = list;
    if (S.gsub !== 'english') shown = list.filter(function (s) { return s.kind !== 'special' && s.takes_book_edu; });
    out += gridHtml(shown, S.gsub, course);
    if (S.gsub === 'english' && isM && list.some(function (s) { return !editable(s, 'english'); }) && !S.admin) out += '<p class="note">' + t('readonly') + '</p>';
  }
  return out;
}

async function go() { try { await loadScores(S.period); } catch (e) { toast(t('loadErr')); } render(); }

/* ===================== действия ===================== */
async function afterLogin(user) {
  S.uid = user.id; S.loggedIn = true; el('view').innerHTML = '<p class="note">' + t('loading') + '</p>';
  try { await loadAll(); } catch (e) { toast(t('loadErr')); console.error(e); }
  var keys = navKeys(); S.nav = keys[0] || 'me'; S.tab = (D.students[S.uid] ? cabinetTabs(D.students[S.uid])[0] : 'schedule');
  render();
}
document.addEventListener('submit', async function (e) {
  if (e.target.id !== 'loginForm') return;
  e.preventDefault();
  var u = el('lu').value.trim().toLowerCase(), p = el('lp').value;
  if (!u || !p) return;
  var email = u.indexOf('@') > 0 ? u : u + '@' + DOMAIN;
  el('lerr').textContent = '';
  var r = await sb.auth.signInWithPassword({ email: email, password: p });
  if (r.error) { S.loginErr = t('badLogin'); el('lerr').textContent = S.loginErr; return; }
  S.loginErr = ''; afterLogin(r.data.user);
});
function readNum(raw) {
  raw = String(raw).trim().replace(',', '.');
  if (raw === '') return { ok: true, v: null };
  var n = Number(raw);
  if (!isFinite(n) || n < 0 || n > 100) return { ok: false };
  return { ok: true, v: Math.round(n * 100) / 100 };
}
function refreshTot(sid, subj) {
  document.querySelectorAll('[data-tot="' + sid + '|' + subj + '"]').forEach(function (c) { c.textContent = fmt(calc(sid, subj).total); });
}
document.addEventListener('change', async function (e) {
  var x = e.target;
  if (x.id === 'gsel') { S.gsel = x.value; S.gsub = 'book'; render(); return; }
  if (x.classList && x.classList.contains('cell')) {
    var sid = x.dataset.sid, subj = x.dataset.subj, item = x.dataset.item, r = readNum(x.value), old = getScore(sid, subj, item);
    if (!r.ok) { toast(t('badNum')); x.value = old == null ? '' : old; return; }
    if (r.v === old) { x.value = old == null ? '' : old; return; }
    var ok = await saveScore(sid, subj, item, r.v);
    x.value = ok ? (r.v == null ? '' : r.v) : (old == null ? '' : old);
    if (ok) { refreshTot(sid, subj); }
  }
});
document.addEventListener('input', function (e) {
  if (e.target.id === 'q') {
    S.q = e.target.value; var q = S.q.trim().toLowerCase();
    var list = Object.keys(D.students).map(function (k) { return D.students[k]; }).sort(byName).filter(function (s) { return !q || pname(s.id).toLowerCase().indexOf(q) >= 0 || (D.profiles[s.id].username || '').indexOf(q) >= 0; });
    el('slist').innerHTML = studentList(list);
  }
});
async function act(b) {
  var a = b.dataset.a, sid = b.dataset.sid;
  if (a === 'out') { await sb.auth.signOut(); S.loggedIn = false; S.sel = null; S.pwdOpen = false; render(); return; }
  if (a === 'pwd') { S.pwdOpen = !S.pwdOpen; render(); return; }
  if (a === 'pwdsave') {
    var np = el('np').value;
    if (np.length < 6) { toast(t('pwdShort')); return; }
    var r = await sb.auth.updateUser({ password: np });
    if (r.error) { toast(r.error.message); return; }
    S.pwdOpen = false; toast(t('pwdOk')); render(); return;
  }
  if (a === 'open') { S.sel = sid; S.dtab = cabinetTabs(D.students[sid])[0]; S.resetAsk = false; window.scrollTo(0, 0); render(); return; }
  if (a === 'back') { S.sel = null; S.resetAsk = false; render(); return; }
  if (a === 'sport') {
    var cur = getScore(sid, 'sport', b.dataset.item), nv = cur == null ? 1 : (cur === 1 ? 0 : null);
    if (await saveScore(sid, 'sport', b.dataset.item, nv)) {
      document.querySelectorAll('[data-a="sport"][data-sid="' + sid + '"][data-item="' + b.dataset.item + '"]').forEach(function (n) {
        n.className = 'pm ' + (nv === 1 ? 'plus' : nv === 0 ? 'minus' : ''); n.lastChild.textContent = nv === 1 ? '+' : nv === 0 ? '−' : '·';
      });
    }
    return;
  }
  if (a === 'idpsave') {
    var ta = el('idp-' + sid) || el('idpText'), r2 = await sb.from('idp_notes').upsert({ student_id: sid, content: ta.value, updated_by: S.uid, updated_at: new Date().toISOString() }, { onConflict: 'student_id' }).select();
    if (r2.error) { toast(t('saveErr')); return; }
    D.idp[sid] = r2.data[0]; toast(t('saved')); return;
  }
  if (a === 'stusave') {
    var upd = {
      status: el('f-status').value, funding: el('f-funding').value || null,
      mentor_group_id: el('f-mg').value ? Number(el('f-mg').value) : null, english_group_id: el('f-eg').value ? Number(el('f-eg').value) : null,
      course: el('f-course').value.trim() ? Number(el('f-course').value) : null, sub_group: el('f-sub').value.trim() || null, notion_url: el('f-notion').value.trim() || null
    };
    var r3 = await sb.from('students').update(upd).eq('id', sid).select();
    if (r3.error || !r3.data.length) { toast(t('saveErr')); return; }
    D.students[sid] = r3.data[0]; toast(t('saved')); render(); return;
  }
  if (a === 'resetask') { S.resetAsk = sid; render(); return; }
  if (a === 'resetno') { S.resetAsk = false; render(); return; }
  if (a === 'resetyes') {
    var r4 = await sb.rpc('admin_reset_password', { target: sid }); S.resetAsk = false;
    toast(r4.error ? t('saveErr') : t('resetDone')); render(); return;
  }
  if (a === 'monsave') {
    var pid = Number(b.dataset.pid), card = b.closest('section[data-pid]'), upd2 = { locked: card.querySelector('[data-lock]').checked }, bad = false;
    card.querySelectorAll('[data-w]').forEach(function (i) {
      var n = Number(i.value); if (!isFinite(n) || n < 0 || n > 100) { bad = true; return; }
      upd2['w_' + i.dataset.w + '_exam'] = n / 100; upd2['w_' + i.dataset.w + '_weekly'] = (100 - n) / 100;
    });
    if (bad) { toast(t('badNum')); return; }
    var r5 = await sb.from('periods').update(upd2).eq('id', pid).select();
    if (r5.error || !r5.data.length) { toast(t('saveErr')); return; }
    var rows = [1, 2, 3, 4].map(function (c) {
      return { period_id: pid, course: c, title: card.querySelector('[data-bt="' + c + '"]').value.trim() || null, exam2_type: card.querySelector('[data-be="' + c + '"]').value };
    });
    var r6 = await sb.from('books').upsert(rows, { onConflict: 'period_id,course' }).select();
    if (r6.error) { toast(t('saveErr')); return; }
    D.periods = D.periods.map(function (p) { return p.id === pid ? r5.data[0] : p; });
    D.books = D.books.filter(function (x) { return x.period_id !== pid; }).concat(r6.data);
    toast(t('saved')); return;
  }
}
document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-a],[data-nav],[data-tab],[data-dtab],[data-gsub],[data-period],[data-lang]');
  if (!b) return;
  if (b.dataset.a) { act(b); return; }
  if (b.dataset.lang) { S.lang = b.dataset.lang; try { localStorage.setItem('mu-lang', S.lang); } catch (x) {} render(); return; }
  if (b.dataset.nav) { if (isStaff()) S.nav = b.dataset.nav; else S.tab = b.dataset.nav; S.sel = null; window.scrollTo(0, 0); render(); return; }
  if (b.dataset.tab) { S.tab = b.dataset.tab; render(); return; }
  if (b.dataset.dtab) { S.dtab = b.dataset.dtab; render(); return; }
  if (b.dataset.gsub) { S.gsub = b.dataset.gsub; render(); return; }
  if (b.dataset.period) { S.period = Number(b.dataset.period); go(); return; }
});

/* ===================== запуск ===================== */
(async function () {
  render();
  try {
    var r = await sb.auth.getSession();
    if (r.data && r.data.session) await afterLogin(r.data.session.user);
  } catch (e) { console.error(e); }
})();
</script>
